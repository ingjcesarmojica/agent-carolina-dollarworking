<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carolina - Asesora Virtual Dollar Working</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #14173f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
        }

        .app-container {
            width: 380px;
            height: 700px;
            background: #14173f;
            border: 1px solid #306eff;
            border-radius: 30px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            padding: 12px 20px 10px;
            flex-shrink: 0;
            background: #062462;
            border-bottom: 2px solid #306eff;
        }

        .header-title {
            font-size: 20px;
            font-weight: 800;
            color: #ffc704;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 15px;
            padding-left: 15px;
        }

        .logo-img {
            width: 110px;
            height: 110px;
            border-radius: 14px;
            object-fit: contain;
        }

        .profile-section {
            text-align: center;
            position: relative;
        }

        .avatar-container {
            width: 80px;
            height: 80px;
            margin: 0 auto 10px;
            position: relative;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid #ffc704;
            background: #e2e8f0 url('images/avatar.png') center/cover;
            position: relative;
            z-index: 2;
        }

        .online-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #25d366;
            color: #ffffff;
            font-size: 9px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 8px;
            white-space: nowrap;
            z-index: 3;
            border: 2px solid #062462;
            animation: pulseBadge 2s ease-in-out infinite;
        }

        @keyframes pulseBadge {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .pulse-rings {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            z-index: 1;
            opacity: 1;
        }

        .pulse-rings.active {
            opacity: 1;
        }

        .pulse-ring {
            position: absolute;
            border: 2px solid rgba(48, 110, 255, 0.4);
            border-radius: 50%;
            width: 100%;
            height: 100%;
            animation: pulse 2s ease-out infinite;
        }

        .pulse-ring:nth-child(2) { animation-delay: 0.3s; }
        .pulse-ring:nth-child(3) { animation-delay: 0.6s; }

        @keyframes pulse {
            0% { transform: scale(0.75); opacity: 0.8; }
            100% { transform: scale(1.2); opacity: 0; }
        }

        .profile-name {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 2px;
        }

        .profile-title {
            font-size: 13px;
            color: #ffc704;
            font-weight: 500;
        }

        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }

        .chat-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
            padding: 0;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 0;
        }

        .chat-messages::-webkit-scrollbar {
            width: 4px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #306eff;
            border-radius: 2px;
        }

        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 13px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.bot {
            align-self: flex-start;
            background: #062462;
            color: #ffffff;
            border-bottom-left-radius: 4px;
            border: 1px solid #306eff;
        }

        .message.user {
            align-self: flex-end;
            background: #306eff;
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .message.typing {
            background: #062462;
            border: 1px solid #306eff;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
            padding: 4px 0;
        }

        .typing-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #ffc704;
            animation: typingBounce 1.4s infinite ease-in-out both;
        }

        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes typingBounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 4px 0 4px 0;
            align-self: flex-start;
            max-width: 95%;
        }

        .option-btn {
            padding: 10px 16px;
            border-radius: 20px;
            border: 2px solid #306eff;
            background: transparent;
            color: #306eff;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            text-align: left;
            white-space: normal;
            word-wrap: break-word;
            overflow-wrap: break-word;
            line-height: 1.4;
        }

        .option-btn:hover {
            background: #306eff;
            color: #ffffff;
            transform: translateX(4px);
        }

        .option-btn.secondary {
            border-color: #ffc704;
            color: #ffc704;
        }

        .option-btn.secondary:hover {
            background: #ffc704;
            color: #14173f;
        }

        .option-btn.menu-btn {
            border-color: #14173f;
            color: #8899bb;
            background: rgba(20, 23, 63, 0.5);
        }

        .option-btn.menu-btn:hover {
            background: #062462;
            color: #ffffff;
            border-color: #306eff;
        }

        .option-btn.whatsapp-btn {
            border-color: #25d366;
            color: #25d366;
        }

        .option-btn.whatsapp-btn:hover {
            background: #25d366;
            color: #ffffff;
        }

        .chat-input-area {
            padding: 10px 15px 15px;
            display: flex;
            gap: 8px;
            background: #062462;
            flex-shrink: 0;
            border-top: 1px solid #306eff;
        }

        .chat-input {
            flex: 1;
            padding: 10px 15px;
            border-radius: 20px;
            border: 1px solid #306eff;
            background: #14173f;
            color: #ffffff;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            outline: none;
        }

        .chat-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .chat-input:focus {
            border-color: #ffc704;
        }

        .send-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: #ffc704;
            color: #14173f;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .send-btn:hover {
            background: #306eff;
            color: #ffffff;
            transform: scale(1.05);
        }

        .send-btn:disabled {
            background: rgba(255, 255, 255, 0.2);
            cursor: not-allowed;
            transform: none;
        }

        .send-btn svg {
            width: 18px;
            height: 18px;
        }

        .status-indicator {
            text-align: center;
            padding: 8px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
            flex-shrink: 0;
            background: #062462;
            border-top: 1px solid #306eff;
        }

        .error-message {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            background: rgba(239, 68, 68, 0.9);
            color: #ffffff;
            padding: 8px;
            border-radius: 8px;
            font-size: 11px;
            text-align: center;
            display: none;
            z-index: 10;
        }

        .speak-btn {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: none;
            background: rgba(48, 110, 255, 0.3);
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            transition: all 0.2s ease;
        }

        .speak-btn:hover {
            background: #306eff;
        }

        .speak-btn.playing {
            background: #ffc704;
            color: #14173f;
        }

        @media (max-width: 420px) {
            .app-container {
                width: 100%;
                height: 100vh;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="error-message" id="errorMessage"></div>

        <div class="header">
            <div class="header-title">Dollar Working</div>
            <div class="profile-section">
                <div class="online-badge">En línea</div>
                <div class="avatar-container">
                    <div class="avatar"></div>
                    <div class="pulse-rings" id="pulseRings">
                        <div class="pulse-ring"></div>
                        <div class="pulse-ring"></div>
                        <div class="pulse-ring"></div>
                    </div>
                </div>

                <div class="profile-name">Carolina</div>
                <div class="profile-title">Asesora Virtual</div>
            </div>
        </div>

        <div class="content-area">
            <div class="chat-view active" id="chatView">
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-area">
                    <input type="text" class="chat-input" id="chatInput" placeholder="Escribe tu mensaje..." onkeypress="handleKeyPress(event)">
                    <button class="send-btn" id="sendBtn" onclick="sendChatText()">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <div class="status-indicator" id="statusIndicator">Listo para ayudarte</div>
    </div>

    <script>
        let isSpeaking = false;
        let currentAudio = null;
        let chatHistory = [];

        const CHAT_API_URL = '/api/chat';
        const SPEAK_API_URL = '/api/speak';

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendChatText();
            }
        }

        function sendChatText() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();

            if (!message) return;

            addMessage(message, 'user');
            input.value = '';

            document.getElementById('sendBtn').disabled = true;
            showTyping();

            fetch(CHAT_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message })
            })
            .then(response => response.json())
            .then(data => {
                hideTyping();
                document.getElementById('sendBtn').disabled = false;

                if (data.error) {
                    addMessage('Lo siento, hubo un error. Intenta de nuevo.', 'bot');
                    return;
                }

                addMessage(data.response, 'bot', data.options);
            })
            .catch(error => {
                hideTyping();
                document.getElementById('sendBtn').disabled = false;
                addMessage('Error de conexión. Verifica tu internet.', 'bot');
            });
        }

        function addMessage(text, sender, options) {
            const container = document.getElementById('chatMessages');
            const msg = document.createElement('div');
            msg.className = `message ${sender}`;

            const textSpan = document.createElement('span');
            textSpan.innerHTML = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            msg.appendChild(textSpan);

            if (sender === 'bot') {
                const speakBtn = document.createElement('button');
                speakBtn.className = 'speak-btn';
                speakBtn.innerHTML = '🔊';
                speakBtn.onclick = function() { speakMessage(text, this); };
                msg.style.position = 'relative';
                msg.appendChild(speakBtn);
            }

            container.appendChild(msg);

            if (options && options.length > 0) {
                const optionsContainer = document.createElement('div');
                optionsContainer.className = 'options-container';

                options.forEach(option => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';

                    if (option.value === 'menu' || option.value === 'inicio') {
                        btn.classList.add('menu-btn');
                    } else if (option.value === 'whatsapp' || (option.url && option.url.includes('wa.me'))) {
                        btn.classList.add('whatsapp-btn');
                    } else if (option.value === 'comparar' || option.value === 'testimonios' || option.value === 'faq' || option.value === 'recibir_info') {
                        btn.classList.add('secondary');
                    }

                    btn.textContent = option.label;

                    if (option.url) {
                        btn.onclick = function() {
                            window.open(option.url, '_blank');
                        };
                    } else {
                        btn.onclick = function() {
                            handleOptionClick(option.value, option.label);
                        };
                    }

                    optionsContainer.appendChild(btn);
                });

                container.appendChild(optionsContainer);
            }

            container.scrollTop = container.scrollHeight;
        }

        function handleOptionClick(value, label) {
            addMessage(label, 'user');
            showTyping();

            fetch(CHAT_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: value })
            })
            .then(response => response.json())
            .then(data => {
                hideTyping();

                if (data.error) {
                    addMessage('Lo siento, hubo un error. Intenta de nuevo.', 'bot');
                    return;
                }

                addMessage(data.response, 'bot', data.options);
            })
            .catch(error => {
                hideTyping();
                addMessage('Error de conexión. Verifica tu internet.', 'bot');
            });
        }

        function showTyping() {
            const container = document.getElementById('chatMessages');
            const typing = document.createElement('div');
            typing.className = 'message bot typing';
            typing.id = 'typingIndicator';
            typing.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
            container.appendChild(typing);
            container.scrollTop = container.scrollHeight;
            document.getElementById('pulseRings').classList.add('active');
        }

        function hideTyping() {
            const typing = document.getElementById('typingIndicator');
            if (typing) typing.remove();
            document.getElementById('pulseRings').classList.remove('active');
        }

        function speakMessage(text, btn) {
            if (isSpeaking && currentAudio) {
                currentAudio.pause();
                currentAudio = null;
                isSpeaking = false;
                document.querySelectorAll('.speak-btn').forEach(b => b.classList.remove('playing'));
                if (btn.classList.contains('playing')) return;
            }

            if (btn) btn.classList.add('playing');
            isSpeaking = true;

            fetch(SPEAK_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            })
            .then(response => response.json())
            .then(data => {
                if (data.audioUrl) {
                    currentAudio = new Audio(data.audioUrl);
                    currentAudio.onended = function() {
                        isSpeaking = false;
                        currentAudio = null;
                        if (btn) btn.classList.remove('playing');
                    };
                    currentAudio.onerror = function() {
                        isSpeaking = false;
                        currentAudio = null;
                        if (btn) btn.classList.remove('playing');
                    };
                    currentAudio.play();
                } else {
                    isSpeaking = false;
                    if (btn) btn.classList.remove('playing');
                }
            })
            .catch(() => {
                isSpeaking = false;
                if (btn) btn.classList.remove('playing');
            });
        }

        function showError(message) {
            const el = document.getElementById('errorMessage');
            el.textContent = message;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 5000);
        }

        window.addEventListener('load', function() {
            document.getElementById('statusIndicator').textContent = 'Modo chat activo';
            showTyping();

            fetch(CHAT_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: 'hola' })
            })
            .then(response => response.json())
            .then(data => {
                hideTyping();
                if (data.response) {
                    addMessage(data.response, 'bot', data.options);
                }
            })
            .catch(() => {
                hideTyping();
                addMessage('¡Hola! 👋 Soy Carolina, tu asesora virtual en Dollar Working. ¿En qué puedo ayudarte hoy?', 'bot', [
                    {"label": "Página Web", "value": "pagina_web"},
                    {"label": "Tienda Online", "value": "tienda_online"},
                    {"label": "Chatbot", "value": "chatbot"},
                    {"label": "Agente de IA", "value": "agente_ia"},
                    {"label": "Me gustaría recibir información de cómo puedo iniciar mi negocio con Dollar Working", "value": "no_se"}
                ]);
            });
        });
    </script>
</body>
</html>
