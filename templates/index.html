<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Carolina - Asesora Virtual Dollar Working</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #14173f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        .app-container {
            width: 380px;
            height: 700px;
            max-height: 100vh;
            background: #14173f;
            border: 1px solid #ffffff;
            border-radius: 30px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overscroll-behavior: contain;
        }

.header {
            background: #306eff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 15px;
            border-bottom: 3px solid #ffffff;
            position: relative;
            height: 180px;
            flex-shrink: 0;
        }

        .header-logo {
            position: absolute;
            top: 10px;
            left: 12px;
            height: 70px;
            z-index: 2;
        }

        .header-model {
            position: absolute;
            bottom: 0;
            right: 0;
            height: 170px;
            object-fit: contain;
            object-position: bottom;
        }

        .header-slogan {
            position: absolute;
            bottom: 12px;
            left: 12px;
            font-family: 'Baloo 2', cursive;
            font-weight: 800;
            font-size: 18px;
            color: #ffffff;
            z-index: 2;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .header-title {
            font-size: 20px;
            font-weight: 800;
            color: #ffc704;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .profile-section {
            text-align: center;
            position: relative;
        }

        .avatar-container {
            width: 80px;
            height: 80px;
            margin: 0 auto 10px;
            position: relative;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid #ffffff;
            background: #e2e8f0 url('/static/images/avatar.png') center/cover;
            position: relative;
            z-index: 2;
        }

        .online-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #25d366;
            color: #ffffff;
            font-size: 9px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 8px;
            white-space: nowrap;
            z-index: 3;
            border: 2px solid #ffffff;
            animation: pulseBadge 2s ease-in-out infinite;
        }

        @keyframes pulseBadge {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .profile-name {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 2px;
        }

        .profile-title {
            font-size: 13px;
            color: #ffc704;
            font-weight: 500;
        }

        .mode-toggle {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding: 10px 15px;
            flex-shrink: 0;
        }

        .mode-btn {
            padding: 8px 20px;
            border-radius: 20px;
            border: 2px solid #ffffff;
            background: transparent;
            color: #ffffff;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .mode-btn.active {
            background: #ffc704;
            color: #14173f;
            border-color: #ffc704;
        }

        #callModeBtn {
            background: #306eff;
            color: #ffffff;
            border-color: #306eff;
        }

        .mode-btn:hover {
            background: #ffc704;
            color: #14173f;
            border-color: #ffc704;
        }

        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }

        .call-view, .chat-view {
            flex: 1;
            display: none;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .call-view.active, .chat-view.active {
            display: flex;
        }

        .call-view {
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .action-button {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            transition: all 0.3s ease;
            font-size: 24px;
            position: relative;
            z-index: 3;
        }

        .whatsapp-button {
            background: #28a745;
            color: #ffffff;
        }

        .whatsapp-button:hover {
            background: #218838;
            transform: scale(1.05);
        }

        .end-call-button {
            background: #ef4444;
            color: #ffffff;
            display: none;
        }

        .end-call-button:hover {
            background: #dc2626;
            transform: scale(1.05);
        }

        .phone-waves {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            pointer-events: none;
            display: none;
        }

        .phone-waves.active {
            display: block;
        }

        .phone-wave {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 2px solid #28a745;
            border-radius: 50%;
            animation: phoneWaveAnim 1.5s ease-out infinite;
        }

        .phone-wave:nth-child(2) { animation-delay: 0.5s; }
        .phone-wave:nth-child(3) { animation-delay: 1s; }

        @keyframes phoneWaveAnim {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        .phone-waves.ringing .phone-wave {
            border-color: #28a745;
        }

        .phone-waves.connected .phone-wave {
            border-color: #ef4444;
            animation: none;
            display: none;
        }

        .button-label {
            color: #ffffff;
            font-size: 13px;
            font-weight: 500;
            margin-top: 12px;
            text-align: center;
        }

        .call-view.calling .whatsapp-button { display: none; }
        .call-view.calling .end-call-button { display: flex; }
        .call-view:not(.calling) .end-call-button { display: none; }

        .chat-view {
            padding: 0;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-height: 0;
        }

        .chat-messages::-webkit-scrollbar {
            width: 4px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #306eff;
            border-radius: 2px;
        }

        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 13px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.bot {
            align-self: flex-start;
            background: #ffc704;
            color: #000000;
            border-bottom-left-radius: 4px;
            border: 1px solid #ffffff;
        }

        .message.user {
            align-self: flex-end;
            background: #306eff;
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .message.typing {
            background: #ffc704;
            border: 1px solid #ffffff;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
            padding: 4px 0;
        }

        .typing-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #306eff;
            animation: typingBounce 1.4s infinite ease-in-out both;
        }

        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes typingBounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 4px 0;
            align-self: flex-start;
            max-width: 95%;
        }

        .option-btn {
            padding: 10px 16px;
            border-radius: 20px;
            border: none;
            background: #306eff;
            color: #ffffff;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            text-align: left;
            white-space: normal;
            word-wrap: break-word;
            overflow-wrap: break-word;
            line-height: 1.4;
        }

        .option-btn:hover {
            background: #ffc704;
            color: #14173f;
            transform: translateX(4px);
        }

        .option-btn.secondary {
            background: #ffc704;
            color: #14173f;
        }

        .option-btn.secondary:hover {
            background: #306eff;
            color: #ffffff;
        }

        .option-btn.menu-btn {
            background: transparent;
            border: 2px solid #ffffff;
            color: #ffffff;
        }

        .option-btn.menu-btn:hover {
            background: #ffffff;
            color: #306eff;
        }

        .option-btn.whatsapp-btn {
            background: #25d366;
            color: #ffffff;
        }

        .option-btn.whatsapp-btn:hover {
            background: #128c7e;
            transform: translateX(4px);
        }

        .chat-input-area {
            padding: 10px 15px 15px;
            display: flex;
            gap: 8px;
            background: #306eff;
            flex-shrink: 0;
            border-top: 1px solid #ffffff;
        }

        .send-btn-wrapper {
            background: #306eff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-input {
            flex: 1;
            padding: 10px 15px;
            border-radius: 20px;
            border: 1px solid #ffffff;
            background: #14173f;
            color: #ffffff;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            outline: none;
        }

        .chat-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .chat-input:focus {
            border-color: #ffc704;
        }

        .send-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: #ffc704;
            color: #14173f;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .send-btn:hover {
            background: #306eff;
            color: #ffffff;
            transform: scale(1.05);
        }

        .send-btn:disabled {
            background: rgba(255, 255, 255, 0.2);
            cursor: not-allowed;
            transform: none;
        }

        .send-btn svg {
            width: 18px;
            height: 18px;
        }

        .status-indicator {
            text-align: center;
            padding: 8px;
            font-size: 11px;
            color: #000000;
            flex-shrink: 0;
            background: #ffc704;
            border-top: 1px solid #ffffff;
        }

        .error-message {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            background: rgba(239, 68, 68, 0.9);
            color: #ffffff;
            padding: 8px;
            border-radius: 8px;
            font-size: 11px;
            text-align: center;
            display: none;
            z-index: 10;
        }

        .speak-btn {
            display: none;
        }

        .speak-btn:hover {
            background: #306eff;
        }

        .speak-btn.playing {
            background: #ffc704;
            color: #14173f;
        }

        .audio-toggle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            background: transparent;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .audio-toggle.active {
            background: #ffffff;
            color: #306eff;
        }

        .audio-toggle:hover {
            background: #ffc704;
            color: #14173f;
            border-color: #ffc704;
        }

        .lead-form {
            padding: 8px 15px 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .lead-form input {
            padding: 12px 15px;
            border: 2px solid #ffffff;
            border-radius: 12px;
            background: #ffc704;
            color: #000000;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: all 0.3s ease;
        }

        .lead-form input::placeholder {
            color: rgba(0, 0, 0, 0.5);
        }

        .lead-form input:focus {
            border-color: #306eff;
        }

        .lead-form input.error {
            border-color: #ff4444;
            background: #ffcccc;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .lead-form button {
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: #306eff;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .lead-form button:hover {
            background: #2f6eff;
            transform: scale(1.02);
        }

        .lead-form button:disabled {
            background: rgba(48, 110, 255, 0.5);
            cursor: not-allowed;
            transform: none;
        }

        @media (max-width: 420px) {
            .app-container {
                width: 100%;
                height: 100vh;
                max-height: 100vh;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="error-message" id="errorMessage"></div>

        <div class="header">
            <img class="header-logo" src="/static/images/logo.png" alt="Dollar Working">
            <img class="header-model" src="/static/images/modelofooter.png" alt="Carolina">
            <div class="header-slogan">Te Ayudamos</div>
        </div>

        <div class="mode-toggle">
            <button class="audio-toggle active" id="audioToggle" onclick="toggleAudio()" title="Audio on/off">
                <svg id="audioOnIcon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                </svg>
                <svg id="audioOffIcon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" style="display:none;">
                    <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                </svg>
            </button>
            <div id="chatBtnWrapper" style="position:relative;display:inline-flex;">
                <button class="mode-btn active" id="chatModeBtn" onclick="switchMode('chat')">Chat</button>
            </div>
            <div id="callBtnWrapper" style="position:relative;display:inline-flex;">
                <button class="mode-btn" id="callModeBtn" onclick="switchMode('call')">Llamada</button>
            </div>
        </div>

        <div class="content-area">
            <div class="chat-view active" id="chatView">
                <div class="chat-messages" id="chatMessages">
                    <div id="leadFormContainer" class="lead-form" style="display:none;">
                        <input type="text" id="leadName" placeholder="* Nombre completo" autocomplete="name">
                        <input type="tel" id="leadPhone" placeholder="* Celular (ej: +57 300 123 4567)" autocomplete="tel">
                        <input type="email" id="leadEmail" placeholder="* Correo electronico" autocomplete="email">
                        <button id="leadSubmitBtn" onclick="submitLeadForm()">Enviar</button>
                    </div>
                </div>
                <div class="chat-input-area" id="chatInputArea">
                    <input type="text" class="chat-input" id="chatInput" placeholder="Escribe tu mensaje..." onkeypress="handleKeyPress(event)">
                    <div class="send-btn-wrapper">
                        <button class="send-btn" id="sendBtn" onclick="sendChatText()">
                            <svg viewBox="0 0 24 24" fill="currentColor">
                                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <div class="call-view" id="callView">
                <div style="position:relative;display:inline-flex;">
                    <div class="phone-waves" id="phoneWaves">
                        <div class="phone-wave"></div>
                        <div class="phone-wave"></div>
                        <div class="phone-wave"></div>
                    </div>
                    <button class="action-button whatsapp-button" id="startCallBtn" onclick="startCall()">
                        <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
                            <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
                        </svg>
                    </button>
                </div>

                <button class="action-button end-call-button" id="endCallBtn" onclick="endCall()">
                    <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
                        <path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.7l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.1-.7-.28-.79-.73-1.68-1.36-2.66-1.85-.33-.16-.56-.51-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/>
                    </svg>
                </button>

                <div class="button-label" id="buttonLabel">Llamar</div>
            </div>
        </div>

        <div class="status-indicator" id="statusIndicator">Listo para ayudarte</div>
    </div>

    <script>
        let currentMode = 'chat';
        let isCalling = false;
        let isListening = false;
        let isSpeaking = false;
        let recognition = null;
        let currentAudio = null;
        let chatHistory = [];
        let ringtoneInterval = null;
        let ringtoneCtx = null;
        let currentFlow = '';
        let userData = { name: '', email: '', phone: '' };
        let audioEnabled = true;

        const CHAT_API_URL = '/api/chat';
        const SPEAK_API_URL = '/api/speak';

        function toggleAudio() {
            audioEnabled = !audioEnabled;
            const toggle = document.getElementById('audioToggle');
            const onIcon = document.getElementById('audioOnIcon');
            const offIcon = document.getElementById('audioOffIcon');
            toggle.classList.toggle('active', audioEnabled);
            onIcon.style.display = audioEnabled ? 'block' : 'none';
            offIcon.style.display = audioEnabled ? 'none' : 'block';
            if (!audioEnabled && currentAudio) {
                currentAudio.pause();
                currentAudio = null;
                isSpeaking = false;
            }
        }

        function submitLeadForm() {
            const nameInput = document.getElementById('leadName');
            const phoneInput = document.getElementById('leadPhone');
            const emailInput = document.getElementById('leadEmail');

            nameInput.classList.remove('error');
            phoneInput.classList.remove('error');
            emailInput.classList.remove('error');

            let hasError = false;

            if (!nameInput.value.trim()) {
                nameInput.classList.add('error');
                hasError = true;
            }
            if (!phoneInput.value.trim()) {
                phoneInput.classList.add('error');
                hasError = true;
            }
            if (!emailInput.value.trim() || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailInput.value.trim())) {
                emailInput.classList.add('error');
                hasError = true;
            }

            if (hasError) {
                showError("Por favor completa todos los campos correctamente.");
                return;
            }

            const name = nameInput.value.trim();
            const phone = phoneInput.value.trim();
            const email = emailInput.value.trim();

            userData.name = name;
            userData.phone = phone;
            userData.email = email;

            document.getElementById('leadFormContainer').style.display = 'none';
            document.getElementById('chatInputArea').style.display = 'flex';

            addMessage("Nombre: " + name + "\nCelular: " + phone + "\nCorreo: " + email, 'user');
            showTyping();

            fetch(CHAT_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: 'lead_form_submitted',
                    flow: 'ask_name',
                    user_data: userData
                })
            })
            .then(response => response.json())
            .then(data => {
                hideTyping();
                if (data.flow) currentFlow = data.flow;
                showTyping();
                setTimeout(() => {
                    hideTyping();
                    addMessage(data.response, 'bot', data.options);
                }, 1500);
            })
            .catch(error => {
                hideTyping();
                addMessage('Error de conexion. Verifica tu internet', 'bot');
            });
        }

        function is_valid_email(text) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(text);
        }

        function showLeadForm() {
            document.getElementById('leadFormContainer').style.display = 'flex';
            document.getElementById('chatInputArea').style.display = 'none';
        }

        function hideLeadForm() {
            document.getElementById('leadFormContainer').style.display = 'none';
            document.getElementById('chatInputArea').style.display = 'flex';
        }

        function switchMode(mode) {
            if (currentMode === mode) return;
            currentMode = mode;

            if (currentAudio) {
                try { currentAudio.pause(); currentAudio = null; } catch(e) {}
            }
            if ('speechSynthesis' in window) speechSynthesis.cancel();
            if (recognition) {
                try { recognition.stop(); } catch(e) {}
                recognition = null;
            }

            const chatBtn = document.getElementById('chatModeBtn');
            const callBtn = document.getElementById('callModeBtn');

            chatBtn.classList.toggle('active', mode === 'chat');
            callBtn.classList.toggle('active', mode === 'call');

            if (mode === 'call') {
                chatBtn.style.background = '#306eff';
                chatBtn.style.color = '#ffffff';
                callBtn.style.background = '#28a745';
                callBtn.style.color = '#ffffff';
                document.getElementById('statusIndicator').textContent = 'Listo para hablar';
            } else {
                endCall();
                chatBtn.style.background = '#ffc704';
                chatBtn.style.color = '#000000';
                callBtn.style.background = '#306eff';
                callBtn.style.color = '#ffffff';
                document.getElementById('statusIndicator').textContent = 'Modo chat activo';
            }

            document.getElementById('chatView').classList.toggle('active', mode === 'chat');
            document.getElementById('callView').classList.toggle('active', mode === 'call');
        }

        function playRingtone() {
            stopRingtone();
            ringtoneCtx = new (window.AudioContext || window.webkitAudioContext)();
            let ringCount = 0;

            function playTone() {
                if (!ringtoneCtx || !isCalling) return;

                const osc1 = ringtoneCtx.createOscillator();
                const osc2 = ringtoneCtx.createOscillator();
                const gainNode = ringtoneCtx.createGain();

                osc1.type = 'sine';
                osc2.type = 'sine';
                osc1.frequency.value = 440;
                osc2.frequency.value = 480;

                gainNode.gain.setValueAtTime(0, ringtoneCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.2, ringtoneCtx.currentTime + 0.05);
                gainNode.gain.setValueAtTime(0.2, ringtoneCtx.currentTime + 0.3);
                gainNode.gain.linearRampToValueAtTime(0, ringtoneCtx.currentTime + 0.35);
                gainNode.gain.setValueAtTime(0, ringtoneCtx.currentTime + 0.4);
                gainNode.gain.linearRampToValueAtTime(0.2, ringtoneCtx.currentTime + 0.45);
                gainNode.gain.setValueAtTime(0.2, ringtoneCtx.currentTime + 0.75);
                gainNode.gain.linearRampToValueAtTime(0, ringtoneCtx.currentTime + 0.8);

                osc1.connect(gainNode);
                osc2.connect(gainNode);
                gainNode.connect(ringtoneCtx.destination);

                osc1.start(ringtoneCtx.currentTime);
                osc2.start(ringtoneCtx.currentTime);
                osc1.stop(ringtoneCtx.currentTime + 0.8);
                osc2.stop(ringtoneCtx.currentTime + 0.8);

                ringCount++;
                if (ringCount >= 4) {
                    clearInterval(ringtoneInterval);
                    ringtoneInterval = null;
                }
            }

            playTone();
            ringtoneInterval = setInterval(playTone, 1000);
        }

        function stopRingtone() {
            if (ringtoneInterval) {
                clearInterval(ringtoneInterval);
                ringtoneInterval = null;
            }
            if (ringtoneCtx) {
                ringtoneCtx.close().catch(() => {});
                ringtoneCtx = null;
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendChatText();
            }
        }

        function sendChatText() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();

            if (!message) return;

            if (currentFlow === 'ask_name') {
                userData.name = message;
            } else if (currentFlow === 'ask_email') {
                userData.email = message;
            } else if (currentFlow === 'ask_phone') {
                userData.phone = message;
            }

            addMessage(message, 'user');
            input.value = '';

            document.getElementById('sendBtn').disabled = true;
            showTyping();

            fetch(CHAT_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: message,
                    flow: currentFlow,
                    user_data: userData
                })
            })
            .then(response => response.json())
            .then(data => {
                hideTyping();
                document.getElementById('sendBtn').disabled = false;

                if (data.error) {
                    addMessage('Lo siento, hubo un error. Intenta de nuevo.', 'bot');
                    return;
                }

                if (data.flow) {
                    currentFlow = data.flow;
                }

                showTyping();
                setTimeout(() => {
                    hideTyping();
                    addMessage(data.response, 'bot', data.options);
                }, 1500);

                if (data.end_call) {
                    switchMode('chat');
                }
            })
            .catch(error => {
                hideTyping();
                document.getElementById('sendBtn').disabled = false;
                addMessage('Error de conexion. Verifica tu internet', 'bot');
            });
        }

        function addMessage(text, sender, options) {
            const container = document.getElementById('chatMessages');
            const form = document.getElementById('leadFormContainer');
            const msg = document.createElement('div');
            msg.className = `message ${sender}`;

            const textSpan = document.createElement('span');
            textSpan.innerHTML = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            msg.appendChild(textSpan);

            container.insertBefore(msg, form);

            if (sender === 'bot' && audioEnabled) {
                speakMessageAuto(text);
            }

            if (options && options.length > 0) {
                const optionsContainer = document.createElement('div');
                optionsContainer.className = 'options-container';

                options.forEach(option => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';

                    if (option.value === 'menu' || option.value === 'inicio') {
                        btn.classList.add('menu-btn');
                    } else if (option.value === 'whatsapp' || (option.url && option.url.includes('wa.me'))) {
                        btn.classList.add('whatsapp-btn');
                    } else if (option.value === 'comparar' || option.value === 'testimonios' || option.value === 'faq' || option.value === 'recibir_info') {
                        btn.classList.add('secondary');
                    }

                    btn.textContent = option.label;

                    if (option.url) {
                        btn.onclick = function() {
                            window.open(option.url, '_blank');
                        };
                    } else {
                        btn.onclick = function() {
                            handleOptionClick(option.value, option.label);
                        };
                    }

                    optionsContainer.appendChild(btn);
                });

                container.appendChild(optionsContainer);
            }

            container.scrollTop = container.scrollHeight;
        }

        function handleOptionClick(value, label) {
            addMessage(label, 'user');
            showTyping();

            fetch(CHAT_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: value,
                    flow: currentFlow,
                    user_data: userData
                })
            })
            .then(response => response.json())
            .then(data => {
                hideTyping();

                if (data.error) {
                    addMessage('Lo siento, hubo un error. Intenta de nuevo.', 'bot');
                    return;
                }

                if (data.flow) {
                    currentFlow = data.flow;
                }

                showTyping();
                setTimeout(() => {
                    hideTyping();
                    addMessage(data.response, 'bot', data.options);
                }, 1500);
            })
            .catch(error => {
                hideTyping();
                addMessage('Error de conexion. Verifica tu internet', 'bot');
            });
        }

        function showTyping() {
            const container = document.getElementById('chatMessages');
            const form = document.getElementById('leadFormContainer');
            const typing = document.createElement('div');
            typing.className = 'message bot typing';
            typing.id = 'typingIndicator';
            typing.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
            container.insertBefore(typing, form);
            container.scrollTop = container.scrollHeight;
            
        }

        function hideTyping() {
            const typing = document.getElementById('typingIndicator');
            if (typing) typing.remove();
            
        }

        function speakMessageAuto(text) {
            if (!audioEnabled) return;
            if (isSpeaking && currentAudio) {
                currentAudio.pause();
                currentAudio = null;
                isSpeaking = false;
            }

            isSpeaking = true;

            fetch(SPEAK_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            })
            .then(response => response.json())
            .then(data => {
                if (data.audioUrl) {
                    currentAudio = new Audio(data.audioUrl);
                    currentAudio.onended = function() {
                        isSpeaking = false;
                        currentAudio = null;
                    };
                    currentAudio.onerror = function() {
                        isSpeaking = false;
                        currentAudio = null;
                    };
                    currentAudio.play();
                } else {
                    isSpeaking = false;
                }
            })
            .catch(() => {
                isSpeaking = false;
            });
        }

        function startCall() {
            if (!('SpeechRecognition' in window || 'webkitSpeechRecognition' in window)) {
                showError("Tu navegador no soporta reconocimiento de voz. Usa Chrome o Edge.");
                return;
            }

            isCalling = true;
            const callView = document.getElementById('callView');
            callView.classList.add('calling');
            document.getElementById('buttonLabel').textContent = 'Finalizar';
            document.getElementById('statusIndicator').textContent = 'Conectando...';
            document.getElementById('startCallBtn').style.background = '#28a745';

            const phoneWaves = document.getElementById('phoneWaves');
            phoneWaves.classList.add('active', 'ringing');

            playRingtone();
            
            setTimeout(() => {
                if (isCalling) {
                    phoneWaves.classList.remove('ringing');
                    phoneWaves.classList.add('connected');
                    document.getElementById('startCallBtn').style.background = '#ef4444';
                    document.getElementById('statusIndicator').textContent = 'Carolina contesta...';
                    
                    let greeting = 'hola';
                    if (currentFlow && currentFlow !== '' && currentFlow !== 'ask_name') {
                        greeting = 'continuar_llamada';
                    }
                    sendCallMessage(greeting);
                }
            }, 3600);
        }

function endCall() {
            isCalling = false;
            isListening = false;
            isSpeaking = false;
            stopRingtone();

            if (recognition) {
                try { recognition.stop(); } catch(e) {}
                recognition = null;
            }

            if (currentAudio) {
                try { currentAudio.pause(); currentAudio = null; } catch(e) {}
            }

            if ('speechSynthesis' in window) speechSynthesis.cancel();

            const callView = document.getElementById('callView');
            callView.classList.remove('calling');
            document.getElementById('buttonLabel').textContent = 'Llamar';
            document.getElementById('startCallBtn').style.background = '#28a745';
            document.getElementById('callModeBtn').style.background = '#306eff';
            document.getElementById('callModeBtn').style.color = '#ffffff';

            const phoneWaves = document.getElementById('phoneWaves');
            phoneWaves.classList.remove('active', 'ringing', 'connected');
            
            if (currentMode === 'call') {
                document.getElementById('statusIndicator').textContent = 'Llamada finalizada';
                setTimeout(() => {
                    if (!isCalling && currentMode === 'call') {
                        document.getElementById('statusIndicator').textContent = 'Listo para hablar';
                    }
                }, 3000);
            }
        }

        function sendCallMessage(message) {
            document.getElementById('statusIndicator').innerHTML = "Procesando<span class='typing-dots'><span></span><span></span><span></span></span>";

            fetch(CHAT_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: message,
                    flow: currentFlow,
                    user_data: userData
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    showError("Error procesando tu mensaje.");
                    startListening();
                    return;
                }

                if (data.flow) {
                    currentFlow = data.flow;
                }

                speakCallText(data.response, data.end_call);
            })
            .catch(error => {
                showError("Error de conexion.");
                startListening();
            });
        }

        function speakCallText(text, endCallAfter) {
            if (currentAudio) {
                try { currentAudio.pause(); currentAudio = null; } catch(e) {}
            }
            if (recognition) {
                try { recognition.stop(); } catch(e) {}
                recognition = null;
            }
            isListening = false;
            isSpeaking = true;
            stopRingtone();
            document.getElementById('statusIndicator').textContent = "Hablando...";
            

            fetch(SPEAK_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            })
            .then(response => response.json())
            .then(data => {
                if (!isCalling) return;
                if (data.audioUrl) {
                    currentAudio = new Audio(data.audioUrl);
                    currentAudio.onended = function() {
                        isSpeaking = false;
                        currentAudio = null;
                        
                        if (!isCalling) return;
                        if (endCallAfter) {
                            endCall();
                        } else {
                            startListening();
                        }
                    };
                    currentAudio.onerror = function() {
                        isSpeaking = false;
                        currentAudio = null;
                        
                        if (!isCalling) return;
                        if (endCallAfter) endCall();
                        else startListening();
                    };
                    currentAudio.play();
                } else {
                    isSpeaking = false;
                    
                    if (!isCalling) return;
                    if (endCallAfter) endCall();
                    else startListening();
                }
            })
            .catch(() => {
                isSpeaking = false;
                
                if (!isCalling) return;
                if (endCallAfter) endCall();
                else startListening();
            });
        }

        function startListening() {
            if (!isCalling || isSpeaking || isListening) return;

            if (recognition) {
                try { recognition.stop(); } catch(e) {}
                recognition = null;
            }

            recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'es-CO';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = function() {
                isListening = true;
                document.getElementById('statusIndicator').textContent = "Escuchando...";
            };

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                isListening = false;
                try { recognition.stop(); } catch(e) {}
                recognition = null;
                sendCallMessage(transcript);
            };

            recognition.onerror = function(event) {
                isListening = false;
                recognition = null;
                if (event.error !== 'no-speech' && event.error !== 'aborted') {
                    console.error('Error reconocimiento:', event.error);
                }
            };

            recognition.onend = function() {
                isListening = false;
                recognition = null;
            };

            try {
                recognition.start();
            } catch(e) {
                console.error('Error microfono:', e);
                recognition = null;
            }
        }

        function showError(message) {
            const el = document.getElementById('errorMessage');
            el.textContent = message;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 5000);
        }

        window.addEventListener('load', function() {
            document.getElementById('statusIndicator').textContent = 'Modo chat activo';
            showTyping();
            currentFlow = '';
            userData = { name: '', email: '', phone: '' };

            fetch(CHAT_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: 'hola', flow: '', user_data: {} })
            })
            .then(response => response.json())
            .then(data => {
                hideTyping();
                if (data.response) {
                    if (data.flow) currentFlow = data.flow;
                    addMessage(data.response, 'bot', data.options);
                }
                if (currentFlow === 'ask_name') {
                    showLeadForm();
                }
            })
            .catch(() => {
                hideTyping();
                addMessage('Hola, soy Carolina, tu asesora de Dollar Working, un gusto saludarte, por favor para poder colaborarte con la información, diligencia los siguientes campos:', 'bot');
                showLeadForm();
            });
        });
    </script>
